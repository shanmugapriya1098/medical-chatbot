<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediChat | AI Health Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon">⚕️</span>
                <h1>MediChat</h1>
            </div>
            <div class="status">
                <span class="dot"></span> Online
            </div>
        </header>

        <main id="chat-window">
            <div class="message bot-message slide-in">
                <div class="avatar">🤖</div>
                <div class="bubble">
                    Hello! I'm your AI health assistant. Please describe your symptoms or ask a health-related question.
                    <br><br>
                    <strong>Note:</strong> I am for informational purposes only. In case of an emergency, call 911
                    immediately.
                </div>
            </div>
        </main>

        <div id="typing-indicator" class="hidden">
            <span></span><span></span><span></span>
        </div>

        <footer>
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Describe your symptoms (e.g. 'I have a fever')..."
                    autocomplete="off" required>
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M2.01 21L23 12L2.01 3L2 10l15 2l-15 2z"></path>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>

</html>
